<!DOCTYPE html>
<html lang="ru">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка товара</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="product-card">
      <img src="photo_2026-02-09_11-21-17.jpg" alt="Буся" class="product-card__image">
        <div class="product-card__content">
            <h2 class="product-card__content__title">Джек рассел</h2>
            <p class="product-card__content__description">
                Гиперактивный, <span class="product-card__content__description--highlight">ЖИРНИ</span> 
                и длинным хвостом. Идеальный выбор для современных пользователей(реальное фотка моей буськи) ).
            </p>
        </div>
        
        <div class="product-card__footer">
            <button class="product-card__footer__button">В корзину</button>
        </div>
    </div>
</body>
</html>
