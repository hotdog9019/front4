global
    log stdout format raw local0

defaults
    log global
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend http_front
    bind *:8081
    default_backend http_back

backend http_back
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server backend1 127.0.0.1:3000 check
    server backend2 127.0.0.1:3001 check
    server backend3 127.0.0.1:3002 check backup
